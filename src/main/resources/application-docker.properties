server.port=8080

# H2 database (file-based) ? fresh schema every time
spring.datasource.url=jdbc:h2:file:/data/demo;MODE=LEGACY;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Force schema recreation (fixes missing columns)
spring.jpa.hibernate.ddl-auto=create

# Always run schema/data scripts if present
spring.sql.init.mode=always

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true